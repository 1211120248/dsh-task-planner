name: Feature request
description: Suggest a focused improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task-management problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Host data, Web GUI, Agent tools, Reminders, Documentation]
    validations:
      required: true
